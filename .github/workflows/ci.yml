name: CI

on:
  push:
  pull_request:

jobs:
  # dotnet 测试多平台矩阵（#9）：ubuntu/windows/macos 三平台同口径跑 test job；
  # fail-fast 关闭——一次 run 同时暴露全部平台的失败，便于按平台分票处置。
  # Windows 腿排除 WindowsServicePipeAclTests / ServicePipeNameEntropyTests（如实登记，#9）：
  # 这两类与任何其他 collection 并发时会冻结整个 test host（xunit.runner.visualstudio 3.1.4 +
  # windows runner 实证：单类隔离 15/15 全绿、含 ACL/Entropy 的并发组合全部 0 完成直至超时，
  # run 41920404363 组合二分）；二类改由 windows-pipe-isolation 专属 job 隔离真跑，覆盖不缺。
  # timeout-minutes: 25 封顶——.NET 10 dotnet test 的默认 1h 运行超时层会先于 VSTest blame-hang
  # 生效并烧满 1 小时（run 41891933332/41904675966 实证），不再给挂起留 1h 预算。
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
            pipe_identity_isolation: true
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      - name: Run tests (exclude Smoke/ExifTool)
        run: dotnet test PhotoPrivacy.sln --configuration Release --filter "Category!=Smoke&Category!=ExifTool${{ matrix.pipe_identity_isolation && '&FullyQualifiedName!~WindowsServicePipeAclTests&FullyQualifiedName!~ServicePipeNameEntropyTests' || '' }}"

  # 服务管道 DACL 命名熵两类（#7/#70 行为测试）的 Windows CI 专属隔离跑（#9）：
  # 与任何其他 collection 并发会冻结 test host（见 test job 注释与 #9 证据链）；
  # 单类隔离实证（真跑）由本 job 建立——见下零匹配守卫注释的假绿教训。
  windows-pipe-isolation:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - WindowsServicePipeAclTests
          - ServicePipeNameEntropyTests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      # 零匹配守卫（CodeRabbit #193 Major）：VSTest 对「过滤器零匹配」静默 exit 0——
      # 曾用带命名空间前缀的 ~ 过滤器（Ipc 段不在前缀内）整腿空跑假绿（run 41927020125
      # 实证 No test matches + success）。先 --list-tests 断言过滤器真选中该类，再真跑。
      - name: Run suite (isolated test host, zero-match guard)
        run: |
          $listed = dotnet test tests/PhotoPrivacy.IntegrationTests --configuration Release --list-tests --filter "FullyQualifiedName~${{ matrix.suite }}"
          if (-not ($listed | Select-String -SimpleMatch "${{ matrix.suite }}")) {
            throw "filter selected zero tests for suite ${{ matrix.suite }} — refusing to fake-green"
          }
          dotnet test tests/PhotoPrivacy.IntegrationTests --configuration Release --filter "FullyQualifiedName~${{ matrix.suite }}"

  # rust 四 crate 矩阵（#9）：ubuntu 之外补 macOS——Windows 侧由 ui-check 覆盖
  # 测试（service/ui 原有，ipc/logs/rules 随 #9 补齐），不另建 Windows job。
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust format
        working-directory: ui
        run: cargo fmt --all -- --check
      - name: Rust clippy (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo clippy -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo test -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --locked

  # UI crate：MSVC 目标做 check（build.rs 不嵌清单），另以 windows-gnu 做一次 release 构建——
  # 这是发布链的实际产出路径（publish-app.ps1 同口径，见 ui/crates/photoprivacy-ui/build.rs 与 #61）。
  ui-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Rust toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu
      - name: Locate windres (windows-gnu release build 前置)
        shell: pwsh
        run: |
          $windres = Get-Command windres -ErrorAction SilentlyContinue
          if (-not $windres) {
            foreach ($candidate in @("C:\msys64\mingw64\bin\windres.exe", "C:\ProgramData\mingw64\mingw64\bin\windres.exe")) {
              if (Test-Path $candidate) { $windres = $candidate; break }
            }
          }
          if (-not $windres) {
            throw "windres not found in PATH or known MinGW locations（候选列表须与 scripts/publish-app.ps1 保持同步）"
          }
          "WINDRES=$windres" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust check (photoprivacy-ui)
        working-directory: ui
        run: cargo check -p photoprivacy-ui --locked
      - name: Rust release build (photoprivacy-ui, windows-gnu —— 发布链产出路径)
        working-directory: ui
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p photoprivacy-ui
      - name: Rust clippy (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo clippy -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-service --locked
      - name: Rust tests (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules --locked
      - name: Rust tests (photoprivacy-ui, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-ui --locked

  markers:
    runs-on: ubuntu-latest
    # CodeRabbit 返修（#193）：显式只读最小权限——与 test/rust/ui-check 的 contents: read
    # 同口径；check-design-markers.sh 的 gh api 只读 open issue，不给多余写面。
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Design markers must point to open issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/check-design-markers.sh
