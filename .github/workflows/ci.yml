name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      - name: Run tests (exclude Smoke/ExifTool)
        run: dotnet test PhotoPrivacy.sln --configuration Release --filter "Category!=Smoke&Category!=ExifTool"

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust format
        working-directory: ui
        run: cargo fmt --all -- --check
      - name: Rust clippy (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo clippy -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo test -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --locked

  # UI crate：MSVC 目标做 check（build.rs 不嵌清单），另以 windows-gnu 做一次 release 构建——
  # 这是发布链的实际产出路径（publish-app.ps1 同口径，见 ui/crates/photoprivacy-ui/build.rs 与 #61）。
  ui-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Rust toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu
      - name: Locate windres (windows-gnu release build 前置)
        shell: pwsh
        run: |
          $windres = Get-Command windres -ErrorAction SilentlyContinue
          if (-not $windres) {
            foreach ($candidate in @("C:\msys64\mingw64\bin\windres.exe", "C:\ProgramData\mingw64\mingw64\bin\windres.exe")) {
              if (Test-Path $candidate) { $windres = $candidate; break }
            }
          }
          if (-not $windres) {
            throw "windres not found in PATH or known MinGW locations（候选列表须与 scripts/publish-app.ps1 保持同步）"
          }
          "WINDRES=$windres" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust check (photoprivacy-ui)
        working-directory: ui
        run: cargo check -p photoprivacy-ui --locked
      - name: Rust release build (photoprivacy-ui, windows-gnu —— 发布链产出路径)
        working-directory: ui
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p photoprivacy-ui
      - name: Rust clippy (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo clippy -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-service --locked
      - name: Rust tests (photoprivacy-ui, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-ui --locked

  # 端到端发布链验证（#10）：CI 只跑测试不跑 publish，发布链坏在 main 上要等发版才暴露
  # （#164 先例）。用 linux-x64 单 RID 代表性验证整条链：cargo release 构建 UI + dotnet
  # publish Worker + ExifTool 下载/SHA256 校验/内置 + 产物结构核验，与 release.yml 的
  # build job 同口径（同走 scripts/publish.sh，Linux 系统依赖同 #84）。不传 artifact，
  # 只作门禁。
  publish-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      - name: Ensure Rust toolchain
        run: rustup default stable
      - name: Install Linux dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          # 独立 key：与 rust job（debug 构建）区分，release 产物才能被 save 复用
          # （actions/cache 精确命中即跳过 save）
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('ui/Cargo.lock') }}
      - name: Publish end-to-end (linux-x64)
        shell: bash
        run: |
          chmod +x scripts/publish.sh
          ./scripts/publish.sh --version 0.1.0-ci --runtime linux-x64 --zip true
      - name: Verify structure
        shell: bash
        run: |
          test -f release/linux-x64/PhotoPrivacy
          test -f release/linux-x64/PhotoPrivacyWorker
          test -f release/linux-x64/config/config.sample.json
          test -f release/linux-x64/config/config.json
          test -f release/linux-x64/ExifTool/exiftool
          test -d release/linux-x64/ExifTool/lib
          test -f release/PhotoPrivacy-0.1.0-ci-linux-x64.tar.gz
          # 内置 ExifTool 必须可执行且为钉扎版本（#164 同类下载链回归在此兜底）
          [ "$(release/linux-x64/ExifTool/exiftool -ver)" = "13.60" ]

  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design markers must point to open issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/check-design-markers.sh
