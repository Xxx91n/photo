name: CI

on:
  push:
  pull_request:

jobs:
  # dotnet 测试多平台矩阵（#9）：ubuntu/windows/macos 三平台同口径跑 test job；
  # fail-fast 关闭——一次 run 同时暴露全部平台的失败，便于按平台分票处置。
  # Windows 侧首跑出现「92/141 完成后全程静默直至 1h 运行超时」的挂起（run 41891933332 /
  # 41904675966 复现，完成数 92→70 漂移，blame-hang 在该形态下未触发）——单测逐一读过均
  # 有界，疑系统性饥饿。win-diag 用单类隔离矩阵定位挂者：每类独立进程 + 12 分钟 job 超时，
  # 超时的 job 即挂者所在类，逐用例 console 输出点名挂点。定位修复后随返修移除本 job。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      - name: Run tests (exclude Smoke/ExifTool)
        run: >-
          dotnet test PhotoPrivacy.sln --configuration Release
          --filter "Category!=Smoke&Category!=ExifTool"
          --blame-hang --blame-hang-timeout 00:10:00 --blame-hang-dump-type mini
          --logger "console;verbosity=normal" --logger "trx"
      - name: Upload test diagnostics (hang sequence/dump/trx)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: '**/TestResults/**'
          retention-days: 7
          if-no-files-found: ignore

  # 挂起定位专用（#9 Windows 首跑）：单类隔离矩阵，每类一个独立 test host。
  win-diag:
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - DesignMarkerSourceTests
          - InvariantReferenceReconciliationTests
          - IpcAuthClaimReconciliationTests
          - Net10CompatibilityGuardTests
          - ProcessHygieneGuardTests
          - PublishPropertiesCsprojGuardTests
          - ServicePipeNameEntropyTests
          - SourceLintTests
          - WindowsServicePipeAclTests
          - WorkerEntryGuardTests
          - WorkerIpcGetRecentLogsTests
          - WorkerIpcResidentStabilityTests
          - WorkerIpcResponseResilienceTests
          - WorkerStartupSweepScopeTests
          - WorkerReloadConfigRegressionTests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.201"
      - name: Run suite (isolated test host, blame-hang + console)
        run: >-
          dotnet test tests/PhotoPrivacy.IntegrationTests --configuration Release
          --filter "FullyQualifiedName~PhotoPrivacy.IntegrationTests.${{ matrix.suite }}"
          --blame-hang --blame-hang-timeout 00:04:00 --blame-hang-dump-type mini
          --logger "console;verbosity=normal" --logger "trx"
      - name: Upload suite diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-diag-${{ matrix.suite }}
          path: '**/TestResults/**'
          retention-days: 7
          if-no-files-found: ignore

  # rust 四 crate 矩阵（#9）：ubuntu 之外补 macOS——Windows 侧由 ui-check 覆盖
  # 测试（service/ui 原有，ipc/logs/rules 随 #9 补齐），不另建 Windows job。
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust format
        working-directory: ui
        run: cargo fmt --all -- --check
      - name: Rust clippy (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo clippy -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules + photoprivacy-service)
        working-directory: ui
        run: cargo test -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules -p photoprivacy-service --locked

  # UI crate：MSVC 目标做 check（build.rs 不嵌清单），另以 windows-gnu 做一次 release 构建——
  # 这是发布链的实际产出路径（publish-app.ps1 同口径，见 ui/crates/photoprivacy-ui/build.rs 与 #61）。
  ui-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Rust toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add x86_64-pc-windows-gnu
      - name: Locate windres (windows-gnu release build 前置)
        shell: pwsh
        run: |
          $windres = Get-Command windres -ErrorAction SilentlyContinue
          if (-not $windres) {
            foreach ($candidate in @("C:\msys64\mingw64\bin\windres.exe", "C:\ProgramData\mingw64\mingw64\bin\windres.exe")) {
              if (Test-Path $candidate) { $windres = $candidate; break }
            }
          }
          if (-not $windres) {
            throw "windres not found in PATH or known MinGW locations（候选列表须与 scripts/publish-app.ps1 保持同步）"
          }
          "WINDRES=$windres" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
      - name: Rust check (photoprivacy-ui)
        working-directory: ui
        run: cargo check -p photoprivacy-ui --locked
      - name: Rust release build (photoprivacy-ui, windows-gnu —— 发布链产出路径)
        working-directory: ui
        run: cargo build --release --locked --target x86_64-pc-windows-gnu -p photoprivacy-ui
      - name: Rust clippy (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo clippy -p photoprivacy-service --all-targets -- -D warnings
      - name: Rust tests (photoprivacy-service, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-service --locked
      - name: Rust tests (photoprivacy-ipc + photoprivacy-logs + photoprivacy-rules, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-ipc -p photoprivacy-logs -p photoprivacy-rules --locked
      - name: Rust tests (photoprivacy-ui, Windows)
        working-directory: ui
        run: cargo test -p photoprivacy-ui --locked

  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design markers must point to open issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/check-design-markers.sh
