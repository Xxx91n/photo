[workspace]
resolver = "2"
members = ["crates/photoprivacy-ipc", "crates/photoprivacy-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# gpui 走 gpui-pre（Zed gpui 的 crates.io 快照，zed rev 08cbb88, 0.3.10）；T4 裁决（#53，已关闭）已接受
# 「锁 rev / 跟 breaking」的依赖治理形态。
# 不依赖 gpui-pre-platform：它在 Windows 上强制 `windows-manifest`，而本机宿主 rustc 是 MSVC、目标却是
# windows-gnu，embed-resource 会调用 rc.exe 产出 MinGW 链接器不认的 .lib；平台后端由本 workspace 自行装配。
[workspace.dependencies]
# Design(#49): gpui 依赖锁死补丁版本（=0.3.10），禁止改成范围版本。
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
]

[workspace.dependencies.libc]
version = "0.2"
